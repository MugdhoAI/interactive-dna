<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Interactive 3D DNA double helix visualization with nucleotide and hydrogen bond details.">
    <title>Interactive DNA</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-color: #030305;
            --card-bg: rgba(10, 12, 18, 0.95);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg-color);
            color: white;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            touch-action: none;
            cursor: grab;
        }

        body.grabbing {
            cursor: grabbing;
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        #dna-system {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .nucleotide {
            position: absolute;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            border: 4px solid transparent;
            border-radius: 50%;
            background-clip: padding-box;
            box-shadow: 0 0 15px 2px currentColor;
            cursor: pointer;
            will-change: transform, opacity;
        }

        .connector {
            position: absolute;
            width: 1px;
            height: 3px;
            margin-top: -1.5px;
            background: white;
            transform-origin: 0 50%;
            cursor: pointer;
            will-change: transform, opacity;
        }

        .connector::after {
            content: "";
            position: absolute;
            top: -20px;
            bottom: -20px;
            left: 0;
            right: 0;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            padding: 0 16px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
        }

        #info-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 85%;
            max-width: 320px;
            padding: 25px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.85);
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            backdrop-filter: blur(10px);
            text-align: left;
        }

        #info-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        #info-card .category {
            display: block;
            margin-bottom: 5px;
            color: var(--neon-blue);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #info-card h2 {
            margin: 0 0 10px;
            font-size: 24px;
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #info-card p {
            margin-bottom: 15px;
            color: #ccc;
            font-size: 14px;
            line-height: 1.5;
        }

        #info-card .stats {
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            font-size: 12px;
            font-family: monospace;
        }

        #close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            padding: 5px;
            border: 0;
            background: none;
            color: #555;
            font-size: 24px;
            cursor: pointer;
        }

        #close-btn:hover,
        #close-btn:focus-visible {
            color: white;
        }

        .nucleotide:focus-visible,
        .connector:focus-visible {
            outline: 2px solid var(--neon-blue);
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            #info-card {
                transition: opacity 0.15s ease;
            }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="dna-system" aria-label="Interactive DNA model"></div>
    </div>

    <div id="hud">
        Drag to rotate · Right drag to pan · Scroll to zoom · Select dots or lines for details
    </div>

    <div id="info-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="close-btn" type="button" aria-label="Close information panel">&times;</button>
        <span class="category" id="modal-cat">Category</span>
        <h2 id="modal-title">Title</h2>
        <p id="modal-desc">Description</p>
        <div class="stats" id="modal-stats">Data</div>
    </div>

    <script>
        const dnaDatabase = [
            {
                pairId: "AT",
                bondName: "Adenine and Thymine",
                bondDesc: "This base pair is connected by two hydrogen bonds.",
                bondStats: "Hydrogen bonds: 2",
                left: {
                    name: "Adenine",
                    type: "Purine",
                    desc: "Adenine is a purine nucleobase found in DNA and RNA. It is also a component of ATP."
                },
                right: {
                    name: "Thymine",
                    type: "Pyrimidine",
                    desc: "Thymine is the pyrimidine nucleobase used in DNA. In RNA, uracil takes its place."
                }
            },
            {
                pairId: "GC",
                bondName: "Guanine and Cytosine",
                bondDesc: "This base pair is connected by three hydrogen bonds.",
                bondStats: "Hydrogen bonds: 3",
                left: {
                    name: "Guanine",
                    type: "Purine",
                    desc: "Guanine is a purine nucleobase that pairs specifically with cytosine in DNA."
                },
                right: {
                    name: "Cytosine",
                    type: "Pyrimidine",
                    desc: "Cytosine is a pyrimidine nucleobase that pairs specifically with guanine in DNA."
                }
            }
        ];

        const config = {
            count: 35,
            radius: 90,
            spacing: 28,
            twist: 0.24,
            rotationSpeed: 0.0006,
            depth: 800,
            minZoom: 0.2,
            maxZoom: 5
        };

        const layers = [];
        const system = document.getElementById("dna-system");
        const viewport = document.getElementById("viewport");
        const modal = document.getElementById("info-card");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const state = {
            t: 0,
            rotX: 0,
            rotY: 0,
            panX: 0,
            panY: 0,
            zoom: 0.8,
            dragging: false,
            lastX: 0,
            lastY: 0,
            lastFrame: 0,
            animationFrame: 0,
            activePointers: new Map(),
            pinchDistance: 0,
            pinchZoom: 0.8,
            justDragged: false
        };

        function init() {
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < config.count; i += 1) {
                const template = dnaDatabase[Math.floor(Math.random() * dnaDatabase.length)];
                const flip = Math.random() > 0.5;
                const dot1Data = flip ? template.right : template.left;
                const dot2Data = flip ? template.left : template.right;
                const hue = 190 + (i / config.count) * 100;
                const color = "hsl(" + hue + ", 100%, 60%)";

                const dot1 = document.createElement("div");
                const dot2 = document.createElement("div");
                const line = document.createElement("div");

                dot1.className = "nucleotide";
                dot2.className = "nucleotide";
                line.className = "connector";

                dot1.style.color = color;
                dot1.style.backgroundColor = color;
                dot2.style.color = color;
                dot2.style.backgroundColor = color;
                line.style.background = "linear-gradient(90deg, transparent, " + color + ", transparent)";

                dot1.dataset.layer = String(i);
                dot1.dataset.part = "dot1";
                dot2.dataset.layer = String(i);
                dot2.dataset.part = "dot2";
                line.dataset.layer = String(i);
                line.dataset.part = "bond";

                dot1.tabIndex = 0;
                dot2.tabIndex = 0;
                line.tabIndex = 0;
                dot1.setAttribute("role", "button");
                dot2.setAttribute("role", "button");
                line.setAttribute("role", "button");
                dot1.setAttribute("aria-label", dot1Data.name);
                dot2.setAttribute("aria-label", dot2Data.name);
                line.setAttribute("aria-label", template.bondName);

                fragment.append(line, dot1, dot2);

                layers.push({
                    dot1,
                    dot2,
                    line,
                    dot1Style: dot1.style,
                    dot2Style: dot2.style,
                    lineStyle: line.style,
                    dot1Data,
                    dot2Data,
                    bondData: template,
                    y: (i * config.spacing) - ((config.count * config.spacing) / 2),
                    angle: i * config.twist,
                    lastDot1Z: null,
                    lastDot2Z: null,
                    lastLineZ: null
                });
            }

            system.appendChild(fragment);
            startAnimation();
        }

        function showDetails(layer, part) {
            let category;
            let title;
            let description;
            let stats;

            if (part === "bond") {
                category = "Hydrogen Bond";
                title = layer.bondData.bondName;
                description = layer.bondData.bondDesc;
                stats = layer.bondData.bondStats;
            } else {
                const base = part === "dot1" ? layer.dot1Data : layer.dot2Data;
                category = "Nucleobase";
                title = base.name;
                description = base.desc;
                stats = "Class: " + base.type;
            }

            document.getElementById("modal-cat").textContent = category;
            document.getElementById("modal-title").textContent = title;
            document.getElementById("modal-desc").textContent = description;
            document.getElementById("modal-stats").textContent = stats;
            modal.classList.add("active");
        }

        function closeModal() {
            modal.classList.remove("active");
        }

        function project(x, y, z, cx, sx, cy, sy) {
            const rotatedY = y * cx - z * sx;
            const rotatedZ = y * sx + z * cx;
            const rotatedX = x * cy + rotatedZ * sy;
            const finalZ = -x * sy + rotatedZ * cy;
            const scale = config.depth / (config.depth + finalZ);
            const projectedScale = scale * state.zoom;

            return {
                x: rotatedX * projectedScale + state.panX,
                y: rotatedY * projectedScale + state.panY,
                scale: projectedScale,
                opacity: Math.max(0.2, scale - 0.2)
            };
        }

        function updateObject(style, pos, previousZ) {
            const displayScale = pos.scale * (0.6 + pos.scale * 0.4);
            const zIndex = Math.floor(pos.scale * 100);

            style.transform =
                "translate3d(" + pos.x + "px, " + pos.y + "px, 0) scale(" + displayScale + ")";
            style.opacity = pos.opacity;

            if (previousZ !== zIndex) {
                style.zIndex = String(zIndex);
            }

            return zIndex;
        }

        function render() {
            const cx = Math.cos(state.rotX);
            const sx = Math.sin(state.rotX);
            const cy = Math.cos(state.rotY);
            const sy = Math.sin(state.rotY);

            for (let i = 0; i < layers.length; i += 1) {
                const layer = layers[i];
                const angle = layer.angle + state.t;
                const sinA = Math.sin(angle);
                const cosA = Math.cos(angle);
                const x1 = sinA * config.radius;
                const z1 = cosA * config.radius;
                const x2 = -x1;
                const z2 = -z1;

                const p1 = project(x1, layer.y, z1, cx, sx, cy, sy);
                const p2 = project(x2, layer.y, z2, cx, sx, cy, sy);

                layer.lastDot1Z = updateObject(layer.dot1Style, p1, layer.lastDot1Z);
                layer.lastDot2Z = updateObject(layer.dot2Style, p2, layer.lastDot2Z);

                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const angleDeg = Math.atan2(dy, dx) * 57.29577951308232;
                const lineOpacity = Math.min(p1.opacity, p2.opacity) * 0.5;
                const lineZ = Math.floor(Math.min(p1.scale, p2.scale) * 100) - 1;

                layer.lineStyle.transform =
                    "translate3d(" + p1.x + "px, " + p1.y + "px, 0) rotate(" +
                    angleDeg + "deg) scaleX(" + distance + ")";
                layer.lineStyle.opacity = lineOpacity;

                if (layer.lastLineZ !== lineZ) {
                    layer.lineStyle.zIndex = String(lineZ);
                    layer.lastLineZ = lineZ;
                }
            }

        }

        function animate(timestamp) {
            if (!state.lastFrame) {
                state.lastFrame = timestamp;
            }

            const delta = Math.min(timestamp - state.lastFrame, 50);
            state.lastFrame = timestamp;
            state.t += delta * config.rotationSpeed;
            render();

            state.animationFrame = requestAnimationFrame(animate);
        }

        function startAnimation() {
            if (reducedMotion || document.hidden || state.animationFrame) {
                render();
                return;
            }

            state.lastFrame = 0;
            state.animationFrame = requestAnimationFrame(animate);
        }

        function stopAnimation() {
            if (state.animationFrame) {
                cancelAnimationFrame(state.animationFrame);
                state.animationFrame = 0;
            }
        }

        function resetView() {
            state.rotX = 0;
            state.rotY = 0;
            state.panX = 0;
            state.panY = 0;
            state.zoom = 0.8;
            render();
        }

        system.addEventListener("click", event => {
            const target = event.target.closest("[data-layer]");
            if (!target || state.dragging || state.justDragged) {
                return;
            }

            const layer = layers[Number(target.dataset.layer)];
            if (layer) {
                showDetails(layer, target.dataset.part);
            }
        });

        system.addEventListener("keydown", event => {
            if (event.key !== "Enter" && event.key !== " ") {
                return;
            }

            event.preventDefault();
            const target = event.target.closest("[data-layer]");
            if (!target) {
                return;
            }

            const layer = layers[Number(target.dataset.layer)];
            if (layer) {
                showDetails(layer, target.dataset.part);
            }
        });

        viewport.addEventListener("pointerdown", event => {
            if (event.target.closest("#info-card")) {
                return;
            }

            state.activePointers.set(event.pointerId, {
                x: event.clientX,
                y: event.clientY,
                button: event.button
            });

            if (event.target.setPointerCapture) {
                event.target.setPointerCapture(event.pointerId);
            }

            if (state.activePointers.size === 1) {
                state.dragging = false;
                state.lastX = event.clientX;
                state.lastY = event.clientY;
                document.body.classList.add("grabbing");
                closeModal();
            } else if (state.activePointers.size === 2) {
                state.dragging = true;
                const points = state.activePointers.values();
                const first = points.next().value;
                const second = points.next().value;
                state.pinchDistance = Math.hypot(
                    first.x - second.x,
                    first.y - second.y
                );
                state.pinchZoom = state.zoom;
            }
        });

        viewport.addEventListener("pointermove", event => {
            if (!state.activePointers.has(event.pointerId)) {
                return;
            }

            const pointer = state.activePointers.get(event.pointerId);
            pointer.x = event.clientX;
            pointer.y = event.clientY;

            if (state.activePointers.size === 2) {
                const points = state.activePointers.values();
                const first = points.next().value;
                const second = points.next().value;
                const distance = Math.hypot(
                    first.x - second.x,
                    first.y - second.y
                );

                if (state.pinchDistance > 0) {
                    const ratio = distance / state.pinchDistance;
                    state.zoom = Math.max(
                        config.minZoom,
                        Math.min(state.pinchZoom * ratio, config.maxZoom)
                    );
                    render();
                }

                return;
            }

            if (state.activePointers.size !== 1) {
                return;
            }

            const dx = event.clientX - state.lastX;
            const dy = event.clientY - state.lastY;
            const moved = Math.hypot(dx, dy);

            if (moved > 3) {
                state.dragging = true;
            }

            if (!state.dragging) {
                return;
            }

            if (event.buttons === 2) {
                state.panX += dx;
                state.panY += dy;
            } else {
                state.rotY += dx * 0.005;
                state.rotX -= dy * 0.005;
            }

            state.lastX = event.clientX;
            state.lastY = event.clientY;
            render();
        });

        function finishPointer(event) {
            state.activePointers.delete(event.pointerId);

            if (state.activePointers.size < 2) {
                state.pinchDistance = 0;
            }

            if (state.activePointers.size === 0) {
                document.body.classList.remove("grabbing");
                state.justDragged = state.dragging;
                setTimeout(() => {
                    state.dragging = false;
                    state.justDragged = false;
                }, 50);
            }
        }

        viewport.addEventListener("pointerup", finishPointer);
        viewport.addEventListener("pointercancel", finishPointer);

        viewport.addEventListener("wheel", event => {
            event.preventDefault();
            state.zoom = Math.max(
                config.minZoom,
                Math.min(state.zoom - event.deltaY * 0.001, config.maxZoom)
            );
        }, { passive: false });

        viewport.addEventListener("contextmenu", event => event.preventDefault());

        document.getElementById("close-btn").addEventListener("click", closeModal);

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeModal();
            }

            if (event.key.toLowerCase() === "r" && !event.ctrlKey && !event.metaKey) {
                resetView();
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopAnimation();
                state.lastFrame = 0;
            } else {
                startAnimation();
            }
        });

        init();
    </script>
</body>
</html>
