<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive DNA - Full Info</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-color: #030305;
            --card-bg: rgba(10, 12, 18, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            touch-action: none;
            cursor: grab;
            color: white;
        }

        body.grabbing { cursor: grabbing; }

        #viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* The 3D World Origin */
        #dna-system {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        /* --- PARTICLES (Nucleotides) --- */
        .nucleotide {
            position: absolute;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            border-radius: 50%;
            background-color: white;
            box-shadow: 0 0 15px 2px currentColor;
            cursor: pointer;
            will-change: transform, opacity;
            z-index: 10;
            /* Make tap target slightly larger without affecting visuals */
            border: 4px solid transparent; 
            background-clip: padding-box;
        }

        /* --- CONNECTORS (Hydrogen Bonds) --- */
        .connector {
            position: absolute;
            height: 3px;
            margin-top: -1.5px;
            background: white;
            transform-origin: 0 50%;
            cursor: pointer;
            will-change: transform, opacity;
            pointer-events: auto; /* Essential for clicking */
        }

        /* Invisible expanded hitbox for easy mobile tapping */
        .connector::after {
            content: '';
            position: absolute;
            top: -20px;
            bottom: -20px;
            left: 0;
            right: 0;
            background: transparent;
        }

        /* --- UI OVERLAY --- */
        #hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* --- INFO CARD --- */
        #info-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 85%;
            max-width: 320px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            backdrop-filter: blur(10px);
            text-align: left;
        }

        #info-card.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        #info-card .category {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-blue);
            margin-bottom: 5px;
            display: block;
        }

        #info-card h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #info-card p {
            color: #ccc;
            line-height: 1.5;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #info-card .stats {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
            font-size: 12px;
            color: #888;
            font-family: monospace;
        }

        #close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #555;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }
        #close-btn:hover { color: white; }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="dna-system"></div>
    </div>

    <div id="hud">
        Touch Dots or Lines for Details
    </div>

    <!-- Info Modal -->
    <div id="info-card">
        <button id="close-btn">&times;</button>
        <span class="category" id="modal-cat">Category</span>
        <h2 id="modal-title">Title</h2>
        <p id="modal-desc">Description</p>
        <div class="stats" id="modal-stats">Data</div>
    </div>

    <script>
        // --- 1. SCIENTIFIC DATA ---
        // DNA always pairs Purines (Double Ring) with Pyrimidines (Single Ring)
        // A <-> T (2 Bonds)
        // G <-> C (3 Bonds)
        
        const dnaDatabase = [
            {
                pairId: 'AT',
                bondName: 'Adenine-Thymine Bond',
                bondDesc: 'A double hydrogen bond connects these two bases. This bond is easier to break than the G-C bond due to having only 2 connections.',
                bondStats: '• Bonds: 2 Hydrogen Bonds<br>• Strength: Moderate',
                left: { name: 'Adenine', type: 'Purine (Double Ring)', desc: 'Adenine is a vital component of ATP (energy) and DNA. Being a Purine, it is physically larger than its partner.' },
                right: { name: 'Thymine', type: 'Pyrimidine (Single Ring)', desc: 'Thymine is found only in DNA (replaced by Uracil in RNA). It pairs exclusively with Adenine.' }
            },
            {
                pairId: 'GC',
                bondName: 'Guanine-Cytosine Bond',
                bondDesc: 'A triple hydrogen bond connects these two. This is the strongest connection in the DNA ladder.',
                bondStats: '• Bonds: 3 Hydrogen Bonds<br>• Strength: High (Strong)',
                left: { name: 'Guanine', type: 'Purine (Double Ring)', desc: 'Guanine is one of the four main nucleobases. It has a double-ring structure.' },
                right: { name: 'Cytosine', type: 'Pyrimidine (Single Ring)', desc: 'Cytosine plays a key role in regulating gene expression. It forms 3 strong bonds with Guanine.' }
            }
        ];

        // --- 2. CONFIGURATION ---
        const config = {
            count: 35,          // How many rungs in the ladder
            radius: 90,         // Width
            spacing: 28,        // Height between rungs
            twist: 0.24,        // Rotation per rung
            speed: 0.01         // Auto rotation speed
        };

        const layers = [];
        const system = document.getElementById('dna-system');
        const modal = document.getElementById('info-card');
        
        // --- 3. STATE ---
        let state = {
            t: 0,
            rotX: 0, rotY: 0,
            panX: 0, panY: 0,
            zoom: 0.8,
            dragging: false,
            lastX: 0, lastY: 0,
            touchStartT: 0,
            pinchDist: 0,
            pinchZoom: 0.8
        };

        // --- 4. BUILDER ---
        function init() {
            for(let i=0; i<config.count; i++) {
                
                // 1. Pick a random pair type (AT or GC)
                const template = dnaDatabase[Math.floor(Math.random() * dnaDatabase.length)];
                
                // 2. Randomize Left/Right orientation
                const flip = Math.random() > 0.5;
                const dot1Data = flip ? template.right : template.left;
                const dot2Data = flip ? template.left : template.right;

                // 3. Create Elements
                const dot1 = document.createElement('div');
                const dot2 = document.createElement('div');
                const line = document.createElement('div');
                
                // 4. Color Logic (Gradient from Blue to Purple based on height)
                const hue = 190 + (i / config.count) * 100;
                const color = `hsl(${hue}, 100%, 60%)`;

                dot1.className = 'nucleotide';
                dot1.style.color = color;
                dot1.style.backgroundColor = color;
                
                dot2.className = 'nucleotide';
                dot2.style.color = color;
                dot2.style.backgroundColor = color;

                line.className = 'connector';
                line.style.background = `linear-gradient(90deg, transparent, ${color}, transparent)`;

                // 5. ATTACH CLICK LISTENERS (Using Closure to keep data specific)
                // We use 'pointerup' for better mobile compatibility
                dot1.onclick = (e) => handleClick(e, 'Nucleobase', dot1Data.name, dot1Data.desc, `Class: ${dot1Data.type}`);
                dot2.onclick = (e) => handleClick(e, 'Nucleobase', dot2Data.name, dot2Data.desc, `Class: ${dot2Data.type}`);
                line.onclick = (e) => handleClick(e, 'Hydrogen Bond', template.bondName, template.bondDesc, template.bondStats);

                // 6. Add to DOM
                system.appendChild(line);
                system.appendChild(dot1);
                system.appendChild(dot2);

                // 7. Store in Array for Animation
                layers.push({
                    dot1, dot2, line,
                    y: (i * config.spacing) - ((config.count * config.spacing)/2),
                    angle: i * config.twist
                });
            }
            requestAnimationFrame(animate);
        }

        // --- 5. INTERACTION HANDLER ---
        function handleClick(e, cat, title, desc, stats) {
            e.stopPropagation(); // Stop the click from reaching the background (drag logic)
            
            // If we were dragging, ignore this "click"
            if(state.dragging) return;

            // Fill Modal
            document.getElementById('modal-cat').innerText = cat;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-stats').innerHTML = stats;
            
            // Show
            modal.classList.add('active');
        }

        document.getElementById('close-btn').onclick = () => modal.classList.remove('active');

        // --- 6. 3D MATH ENGINE ---
        function animate() {
            state.t += config.speed;

            // Pre-calc Rotation Matrices (Camera)
            const cx = Math.cos(state.rotX);
            const sx = Math.sin(state.rotX);
            const cy = Math.cos(state.rotY);
            const sy = Math.sin(state.rotY);

            layers.forEach(l => {
                const a = l.angle + state.t;
                
                // Strand 1 Position (Local)
                const x1 = Math.sin(a) * config.radius;
                const z1 = Math.cos(a) * config.radius;
                
                // Strand 2 Position (Local - Opposite side)
                const x2 = Math.sin(a + Math.PI) * config.radius;
                const z2 = Math.cos(a + Math.PI) * config.radius;

                // Project Both Points
                const p1 = project(x1, l.y, z1, cx, sx, cy, sy);
                const p2 = project(x2, l.y, z2, cx, sx, cy, sy);

                // Update DOM Dot 1
                updateObj(l.dot1, p1);
                // Update DOM Dot 2
                updateObj(l.dot2, p2);

                // Update DOM Line
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const dist = Math.hypot(dx, dy);
                const ang = Math.atan2(dy, dx) * (180/Math.PI);
                
                // Line visuals
                l.line.style.width = `${dist}px`;
                l.line.style.transform = `translate3d(${p1.x}px, ${p1.y}px, 0) rotate(${ang}deg)`;
                // Line opacity is lower than dots
                l.line.style.opacity = Math.min(p1.opacity, p2.opacity) * 0.5;
                // Line Z-index is behind dots
                l.line.style.zIndex = Math.min(l.dot1.style.zIndex, l.dot2.style.zIndex) - 1;
            });

            requestAnimationFrame(animate);
        }

        function project(x, y, z, cx, sx, cy, sy) {
            // Camera Rotate X
            let ry = y * cx - z * sx;
            let rz = y * sx + z * cx;
            // Camera Rotate Y
            let rx = x * cy + rz * sy;
            let finalZ = -x * sy + rz * cy;

            // Perspective
            const depth = 800;
            const scale = depth / (depth + finalZ);
            
            return {
                x: (rx * scale * state.zoom) + state.panX,
                y: (ry * scale * state.zoom) + state.panY,
                scale: scale * state.zoom,
                opacity: Math.max(0.2, (scale - 0.2)) // Fade out back
            };
        }

        function updateObj(el, pos) {
            // Scale based on depth (z-index simulated)
            const s = pos.scale * (0.6 + (pos.scale * 0.4));
            el.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0) scale(${s})`;
            el.style.opacity = pos.opacity;
            el.style.zIndex = Math.floor(pos.scale * 100);
        }

        // --- 7. INPUT HANDLERS (Touch & Mouse) ---
        
        // Touch Start
        window.addEventListener('touchstart', e => {
            if(e.target.closest('#info-card')) return;

            state.touchStartT = Date.now();
            
            if(e.touches.length === 1) {
                // One finger = Prepare Rotate
                state.dragging = false; // Assume click first
                state.lastX = e.touches[0].clientX;
                state.lastY = e.touches[0].clientY;
            } else if(e.touches.length === 2) {
                // Two fingers = Pinch
                state.dragging = true;
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                state.pinchDist = Math.hypot(dx, dy);
                state.pinchZoom = state.zoom;
            }
        }, {passive: false});

        // Touch Move
        window.addEventListener('touchmove', e => {
            if(e.target.closest('#info-card')) return;
            e.preventDefault();

            if(e.touches.length === 1) {
                const x = e.touches[0].clientX;
                const y = e.touches[0].clientY;
                
                // Determine if actual drag occurred (> 5px movement)
                const moveDist = Math.hypot(x - state.lastX, y - state.lastY);
                if(moveDist > 5) state.dragging = true;

                if(state.dragging) {
                    const dx = x - state.lastX;
                    const dy = y - state.lastY;
                    state.rotY += dx * 0.005;
                    state.rotX -= dy * 0.005;
                    state.lastX = x;
                    state.lastY = y;
                }
            } else if(e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                
                if(state.pinchDist > 0) {
                    const ratio = dist / state.pinchDist;
                    state.zoom = Math.max(0.2, Math.min(state.pinchZoom * ratio, 5));
                }
            }
        }, {passive: false});

        // Mouse Fallback
        window.addEventListener('mousedown', e => {
            if(e.target.closest('#info-card')) return;
            state.dragging = false;
            state.lastX = e.clientX;
            state.lastY = e.clientY;
            state.touchStartT = Date.now();
            document.body.classList.add('grabbing');
            modal.classList.remove('active'); // Close modal on interaction
        });

        window.addEventListener('mousemove', e => {
            if(e.buttons === 0) return;
            const moveDist = Math.hypot(e.clientX - state.lastX, e.clientY - state.lastY);
            if(moveDist > 3) state.dragging = true;

            if(state.dragging) {
                const dx = e.clientX - state.lastX;
                const dy = e.clientY - state.lastY;
                
                if(e.buttons === 2) { // Right click Pan
                    state.panX += dx;
                    state.panY += dy;
                } else { // Left click Rotate
                    state.rotY += dx * 0.005;
                    state.rotX -= dy * 0.005;
                }
                state.lastX = e.clientX;
                state.lastY = e.clientY;
            }
        });

        window.addEventListener('mouseup', () => {
            document.body.classList.remove('grabbing');
            // Reset dragging flag slightly later to allow 'click' events to fire if it wasn't a drag
            setTimeout(() => state.dragging = false, 50);
        });

        window.addEventListener('wheel', e => {
            state.zoom += e.deltaY * -0.001;
            state.zoom = Math.max(0.2, Math.min(state.zoom, 5));
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // Start
        init();

    </script>
</body>
</html>
